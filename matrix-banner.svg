<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120" viewBox="0 0 900 120">
  <defs>
    <!-- Fade vertical: letras somem embaixo -->
    <linearGradient id="vFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="1"/>
      <stop offset="60%" stop-color="white" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="mV">
      <rect width="900" height="120" fill="url(#vFade)"/>
    </mask>
    <!-- Fade horizontal: bordas escurecem -->
    <linearGradient id="hFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="black"/>
      <stop offset="12%"  stop-color="white"/>
      <stop offset="88%"  stop-color="white"/>
      <stop offset="100%" stop-color="black"/>
    </linearGradient>
    <mask id="mH">
      <rect width="900" height="120" fill="url(#hFade)"/>
    </mask>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- BG -->
  <rect width="900" height="120" fill="#080808" rx="6"/>
  <!-- Subtle inner border -->
  <rect x="1" y="1" width="898" height="118" fill="none" stroke="#00ff4122" stroke-width="1" rx="5"/>

  <!-- ===== RAIN COLUMNS ===== -->
